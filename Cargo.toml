[package]
name = "boulder-dash-iii"
version = "0.1.0"
edition = "2024"
description = "Portable native Rust remake using resources extracted from the supplied Boulder Dash III CPC disk"

[dependencies]
macroquad = { version = "0.4.16", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
